# Оновлює картинки для профільного README:
#  - картку мов (генерується тут же, без публічного сервісу, який часто лежить)
#  - «змійку», що з'їдає графік контриб'юшенів
# Запуск: щодня автоматично + вручну (Actions → profile → Run workflow)
name: profile

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&bg_color=07070a&title_color=ff2a3a&text_color=f4ecec&border_color=3a0d12&border_radius=14
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push

  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff2a3a&color_dots=#161b22,#3a0d12,#7a1020,#c4001c,#ff2a3a&color_background=#07070a
            dist/snake-light.svg?color_snake=#ff2a3a&color_dots=#ebedf0,#ffd0d4,#ff8a94,#ff4d5c,#ff2a3a

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
